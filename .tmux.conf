set -g mode-keys vi
set -g allow-passthrough on
set -sg escape-time 0
set -g set-clipboard on

set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-kitty:RGB'

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set-option -g status-position top
set -g status-interval 5

set -g status-left-length 80
set -g status-right-length 200

set -g status-style "fg=#7aa2f7,bg=#16161e"
set -g status-left-style "bg=#16161e"
set -g status-right-style "bg=#16161e"

set -g status-left "#[fg=#15161e,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#16161e,nobold,nounderscore,noitalics]"

setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#a9b1d6,bg=#16161e"
setw -g window-status-activity-style "underscore,fg=#a9b1d6,bg=#16161e"

setw -g window-status-format "#[fg=#16161e,bg=#16161e,nobold,nounderscore,noitalics]#[fg=#a9b1d6,bg=#16161e] #I  #W #F #[fg=#16161e,bg=#16161e,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#16161e,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#3b4261,bold] #I  #W #F #[fg=#3b4261,bg=#16161e,nobold,nounderscore,noitalics]"

set -g status-right "#[fg=#16161e,bg=default,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#16161e] #{prefix_highlight} #[fg=#3b4261,bg=#16161e,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#3b4261] #(free -h | awk '/^Mem:/ {print $3 \"/\" $2}') #[fg=#15161e,bg=#7aa2f7,bold] %b %-d %H:%M "

set -g mode-style "fg=#7aa2f7,bg=#3b4261"
set -g message-style "fg=#7aa2f7,bg=#3b4261"
set -g message-command-style "fg=#7aa2f7,bg=#3b4261"

set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

bind a run-shell '\
  CURRENT_SESSION="#{session_name}"; \
  case "$CURRENT_SESSION" in \
    *-Automata) \
      tmux detach-client; \
      ;; \
    *) \
      SAFE_SESSION_NAME=$(echo "$CURRENT_SESSION" | tr -cd "a-zA-Z0-9_-"); \
      POPUP_NAME="$SAFE_SESSION_NAME-Automata"; \
      tmux display-popup \
        -d "#{pane_current_path}" \
        -xC -yC \
        -w 80% -h 75% \
        -E "tmux new-session -A -s $POPUP_NAME -c \"#{pane_current_path}\""; \
      ;; \
  esac \
'

bind s choose-tree -Z -s -f '#{?#{m:*-Automata,#{session_name}},0,1}'
bind S choose-tree -Z -s

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
